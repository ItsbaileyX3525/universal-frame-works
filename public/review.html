<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/review.css">
  <title>Account</title>
</head>
<body>
  <div id="navbar">
    <div id="contents">
      <p id="name" >Universal Frame Works</p>
      <div id="nav-elements">
        <a href="/">Home</a>
        <a href="/review">Reviews</a>
        <a id="navbar-account" class="navbar-disabled" href="/account">Account</a>
        <a id="navbar-login" href="/login">Login</a>
        <a id="navbar-signup" href="/signup">Signup</a>
      </div>
    </div>
  </div>
  <div id="app">
    <div style="margin-top: 10px;">
      <div id="selection-container">
        <div href="development" id="card">
          <p class="default-card" id="center">DEVELOPMENT STUFF</p>
        </div>
        <div href="construction" id="card">
          <p class="default-card" id="center">CONTRUCTION STUFF</p>
        </div>
        <div id="card">
          <p class="default-card" id="center">OTHER STUFF 1</p>
        </div>
        <div id="card">
          <p class="default-card" id="center">OTHER STUFF 2</p>
        </div>
        <div id="card">
          <p class="default-card" id="center">OTHER STUFF 3</p>
        </div>
      </div>
    </div>
  </div>

  <div id="review-modal" class="modal">
    <div class="modal-content">
      <span id="modal-close" class="close">&times;</span>
      <div class="modal-body">
        <div class="modal-image-section">
          <img id="modal-image" src="" alt="Item Image">
        </div>
        <div class="modal-info-section">
          <h2 id="modal-title"></h2>
          <p id="modal-description"></p>
          
          <div class="rating-section">
            <label>Rating:</label>
            <div class="star-rating" id="star-rating">
              <span class="star" data-value="1">★</span>
              <span class="star" data-value="2">★</span>
              <span class="star" data-value="3">★</span>
              <span class="star" data-value="4">★</span>
              <span class="star" data-value="5">★</span>
            </div>
            <span id="rating-value">0</span>/5
          </div>
          
          <div class="comments-section">
            <label for="comment-input">Comments:</label>
            <textarea id="comment-input" placeholder="Write your comments here..."></textarea>
          </div>
          
          <div id="auth-message" class="auth-warning" style="display: none;">
            <p>Please <a href="/login">log in</a> to submit a rating or comment.</p>
          </div>
          
          <button id="submit-btn" class="submit-btn" disabled>Submit Rating & Comment</button>
        </div>
      </div>
      
      <div class="comments-list-section">
        <h3>Comments from Others</h3>
        <div id="comments-list" class="comments-list">
          <!-- Comments will be populated here -->
        </div>
      </div>
    </div>
  </div>
</body>
<script type="module" src="/assets/javascript/review.js"></script>
<script type="module" src="/assets/javascript/navar.js"></script>
<script type="module" src="/assets/javascript/session.js"></script>
</html>
