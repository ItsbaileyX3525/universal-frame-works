<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/login.css">
  <title>Login</title>
</head>
<body>
  <div id="navbar">
    <div id="contents">
      <p id="name" >Universal Frame Works</p>
      <div id="nav-elements">
        <a href="/">Home</a>
        <a href="/review">Reviews</a>
        <a id="navbar-account" class="navbar-disabled" href="/account">Account</a>
        <a id="navbar-login" href="/login">Login</a>
        <a id="navbar-signup" href="/signup">Signup</a>
      </div>
    </div>
  </div>

  <div class="auth-container">
    <div class="auth-box">
      <h1>Login</h1>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" id="login-btn" class="submit-btn">Login</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/signup">Sign up here</a></p>
      </div>
    </div>
  </div>
</body>
<script src="/assets/javascript/login.js"></script>
<script type="module" src="/assets/javascript/navar.js"></script>
</html>
